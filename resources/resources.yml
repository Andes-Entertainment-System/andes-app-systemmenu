# Define your resources here.
tilesets:
  - id: tileset_font
    path: tilesets/font.png
    keep_duplicates: true
  - id: tileset_bg
    path: tilesets/bg.png
    export_plane_arrangement: true
    plane_arrangement_offset: 1
  - id: tileset_bigframe
    path: tilesets/bigframe.png
    export_plane_arrangement: true
    plane_arrangement_offset: 32
  - id: tileset_cursor
    path: tilesets/cursor.png
    export_plane_arrangement: true
    plane_arrangement_offset: 64
spritesets:
  - id: spriteset_smallframe
    path: spritesets/smallframe.png
    settings:
      split:
        mode: none
  - id: spriteset_chevron
    path: spritesets/chevron.png
    settings:
      split:
        mode: manual
        manual_frames:
          - x: 0
            y: 0
            width: 24
            height: 48
          - x: 24
            y: 0
            width: 48
            height: 24
          - x: 24
            y: 24
            width: 48
            height: 24
palettes:
  - id: palette_main
    path: palettes/main.pal
audio:
  - id: music_main
    path: audio/faithfulpremonition.opus
    loop_start: 652580
  - id: sfx_select
    path: audio/sfx_select.opus
  - id: sfx_enter
    path: audio/sfx_enter.opus